[project]
name = "alpha500"
version = "0.1.0"
description = "NSE Momentum & Swing-Trading Dashboard (Project Alpha-500)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "apscheduler>=3.10",
    "xlsxwriter>=3.2",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
alpha500 = "alpha500.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["alpha500.metrics.*", "alpha500.providers.*"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
